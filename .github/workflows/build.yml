name: Gerar APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  celular:
    name: App do celular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: |
          npm install
          npx expo install --fix || true
      - name: Conferir tipos
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean
      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Controle-do-Projetor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celular
          path: Controle-do-Projetor.apk

  projetor:
    name: App do projetor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle -p projetor assembleRelease --no-daemon
      - name: Renomear
        run: cp projetor/app/build/outputs/apk/release/app-release.apk Projetor-Ponte.apk
      - uses: actions/upload-artifact@v4
        with:
          name: projetor
          path: Projetor-Ponte.apk

  testar:
    name: Testar abrindo num celular virtual
    needs: [celular]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: celular
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app no emulador e gravar o log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r -g Controle-do-Projetor.apk
            adb logcat -c
            adb shell monkey -p com.panissa.controleprojetor -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.panissa.controleprojetor && echo APP_VIVO || echo APP_MORREU
            adb logcat -d > logcat-completo.txt || true
            grep -E -A40 "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|ExpoModulesCore|libc.*Fatal|DEBUG  :" logcat-completo.txt > erro-teste.txt || echo "sem erro fatal" > erro-teste.txt
            adb shell pidof com.panissa.controleprojetor >> erro-teste.txt && echo "APP_VIVO" >> erro-teste.txt || echo "APP_MORREU" >> erro-teste.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste
          path: erro-teste.txt

  publicar:
    name: Publicar versão
    needs: [celular, projetor, testar]
    if: always() && needs.celular.result == 'success' && needs.projetor.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versão 1.0.${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            Controle-do-Projetor.apk
            Projetor-Ponte.apk
            erro-teste.txt
