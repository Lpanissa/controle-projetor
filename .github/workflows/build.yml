name: Gerar APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  celular:
    name: App do celular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: |
          npm install
          npx expo install --fix || true
      - name: Conferir tipos
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean
      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Controle-do-Projetor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celular
          path: Controle-do-Projetor.apk

  projetor:
    name: App do projetor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle -p projetor assembleRelease --no-daemon
      - name: Renomear
        run: cp projetor/app/build/outputs/apk/release/app-release.apk Projetor-Ponte.apk
      - uses: actions/upload-artifact@v4
        with:
          name: projetor
          path: Projetor-Ponte.apk

  publicar:
    name: Publicar versão
    needs: [celular, projetor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versão 1.0.${{ github.run_number }}
          files: |
            Controle-do-Projetor.apk
            Projetor-Ponte.apk
