plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.panissa.projetor'
  compileSdk 34

  defaultConfig {
    applicationId 'com.panissa.projetor'
    minSdk 21
    // O projetor é Android 9; mirar no 28 evita restrições de abrir apps em segundo plano.
    //noinspection ExpiredTargetSdkVersion
    targetSdk 28
    versionCode 3
    versionName '1.2'
  }

  // chave fixa: assim as atualizações instalam por cima, sem precisar desinstalar
  signingConfigs {
    ponte {
      storeFile file('ponte.keystore')
      storePassword 'ponte123'
      keyAlias 'ponte'
      keyPassword 'ponte123'
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.ponte
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

dependencies {
  implementation 'androidx.core:core:1.12.0'
}
